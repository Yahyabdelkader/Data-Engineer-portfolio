<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f4ee"/>
      <stop offset="100%" stop-color="#ebe5dc"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9e8867"/>
      <stop offset="100%" stop-color="#7a674b"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#dashBg)"/>

  <!-- Window Container -->
  <g transform="translate(60, 50)">
    <rect width="680" height="380" rx="14" fill="#ffffff" stroke="#ded8cc" stroke-width="1.5" filter="drop-shadow(0 14px 28px rgba(0,0,0,0.05))"/>

    <!-- Window Header -->
    <rect width="680" height="44" rx="14" fill="#faf8f5"/>
    <path d="M 0 44 L 680 44" stroke="#e8e2d8" stroke-width="1"/>
    <!-- Window dots -->
    <circle cx="28" cy="22" r="5" fill="#ded8cc"/>
    <circle cx="44" cy="22" r="5" fill="#ded8cc"/>
    <circle cx="60" cy="22" r="5" fill="#ded8cc"/>
    <text x="340" y="27" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6d6d6d" text-anchor="middle">Sales Intelligence &amp; Performance BI</text>

    <!-- Top Metric Cards -->
    <!-- Metric 1: Total Revenue -->
    <g transform="translate(30, 64)">
      <rect width="180" height="80" rx="10" fill="#faf8f5" stroke="#eee9e0" stroke-width="1"/>
      <text x="16" y="28" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#8c8983">TOTAL REVENUE</text>
      <text x="16" y="56" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#212121">$248,500</text>
      <rect x="110" y="38" width="56" height="20" rx="10" fill="#e8f4ec"/>
      <text x="138" y="52" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#2d7a46" text-anchor="middle">+14.8%</text>
    </g>

    <!-- Metric 2: Orders Count -->
    <g transform="translate(230, 64)">
      <rect width="180" height="80" rx="10" fill="#faf8f5" stroke="#eee9e0" stroke-width="1"/>
      <text x="16" y="28" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#8c8983">PROCESSED ORDERS</text>
      <text x="16" y="56" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#212121">3,420</text>
      <rect x="110" y="38" width="56" height="20" rx="10" fill="#e8f4ec"/>
      <text x="138" y="52" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#2d7a46" text-anchor="middle">+9.2%</text>
    </g>

    <!-- Metric 3: Avg Order Value -->
    <g transform="translate(430, 64)">
      <rect width="220" height="80" rx="10" fill="#faf8f5" stroke="#eee9e0" stroke-width="1"/>
      <text x="16" y="28" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#8c8983">AVG ORDER VALUE</text>
      <text x="16" y="56" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#212121">$72.66</text>
      <rect x="145" y="38" width="60" height="20" rx="10" fill="#f4efe6"/>
      <text x="175" y="52" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#9e8867" text-anchor="middle">STABLE</text>
    </g>

    <!-- Chart 1: Monthly Trends Bar Chart -->
    <g transform="translate(30, 164)">
      <rect width="380" height="190" rx="10" fill="#ffffff" stroke="#eee9e0" stroke-width="1"/>
      <text x="20" y="28" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#212121">Monthly Sales Volume</text>
      <text x="20" y="44" font-family="'Inter', sans-serif" font-size="9" fill="#8c8983">Aggregated with SQL Window Functions</text>

      <!-- Grid lines -->
      <line x1="20" y1="70" x2="360" y2="70" stroke="#f2efe9" stroke-width="1"/>
      <line x1="20" y1="110" x2="360" y2="110" stroke="#f2efe9" stroke-width="1"/>
      <line x1="20" y1="150" x2="360" y2="150" stroke="#eee9e0" stroke-width="1"/>

      <!-- Bars -->
      <rect x="40" y="100" width="22" height="50" rx="4" fill="#dfdbd2"/>
      <rect x="80" y="85" width="22" height="65" rx="4" fill="#dfdbd2"/>
      <rect x="120" y="110" width="22" height="40" rx="4" fill="#dfdbd2"/>
      <rect x="160" y="70" width="22" height="80" rx="4" fill="#9e8867"/>
      <rect x="200" y="60" width="22" height="90" rx="4" fill="#9e8867"/>
      <rect x="240" y="90" width="22" height="60" rx="4" fill="#dfdbd2"/>
      <rect x="280" y="50" width="22" height="100" rx="4" fill="#9e8867"/>
      <rect x="320" y="40" width="22" height="110" rx="4" fill="url(#barGrad)"/>

      <!-- X-axis labels -->
      <text x="51" y="168" font-family="'JetBrains Mono', monospace" font-size="8" fill="#999" text-anchor="middle">Jan</text>
      <text x="91" y="168" font-family="'JetBrains Mono', monospace" font-size="8" fill="#999" text-anchor="middle">Feb</text>
      <text x="131" y="168" font-family="'JetBrains Mono', monospace" font-size="8" fill="#999" text-anchor="middle">Mar</text>
      <text x="171" y="168" font-family="'JetBrains Mono', monospace" font-size="8" fill="#666" text-anchor="middle">Apr</text>
      <text x="211" y="168" font-family="'JetBrains Mono', monospace" font-size="8" fill="#666" text-anchor="middle">May</text>
      <text x="251" y="168" font-family="'JetBrains Mono', monospace" font-size="8" fill="#999" text-anchor="middle">Jun</text>
      <text x="291" y="168" font-family="'JetBrains Mono', monospace" font-size="8" fill="#666" text-anchor="middle">Jul</text>
      <text x="331" y="168" font-family="'JetBrains Mono', monospace" font-size="8" fill="#212121" font-weight="600" text-anchor="middle">Aug</text>
    </g>

    <!-- Chart 2: Top Products Ranking -->
    <g transform="translate(430, 164)">
      <rect width="220" height="190" rx="10" fill="#ffffff" stroke="#eee9e0" stroke-width="1"/>
      <text x="18" y="28" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#212121">Top Products</text>
      <text x="18" y="44" font-family="'Inter', sans-serif" font-size="9" fill="#8c8983">By Gross Margin</text>

      <!-- Row 1 -->
      <text x="18" y="72" font-family="'Inter', sans-serif" font-size="9.5" fill="#333">Enterprise Suite</text>
      <rect x="18" y="78" width="180" height="6" rx="3" fill="#f0ece4"/>
      <rect x="18" y="78" width="150" height="6" rx="3" fill="#9e8867"/>

      <!-- Row 2 -->
      <text x="18" y="108" font-family="'Inter', sans-serif" font-size="9.5" fill="#333">Cloud Storage Add-on</text>
      <rect x="18" y="114" width="180" height="6" rx="3" fill="#f0ece4"/>
      <rect x="18" y="114" width="115" height="6" rx="3" fill="#bfae95"/>

      <!-- Row 3 -->
      <text x="18" y="144" font-family="'Inter', sans-serif" font-size="9.5" fill="#333">API Connector Pro</text>
      <rect x="18" y="150" width="180" height="6" rx="3" fill="#f0ece4"/>
      <rect x="18" y="150" width="85" height="6" rx="3" fill="#dfdbd2"/>
    </g>
  </g>

  <!-- Bottom Tag Banner -->
  <g transform="translate(250, 450)">
    <rect width="300" height="32" rx="16" fill="#ffffff" stroke="#ded8cc" stroke-width="1"/>
    <text x="150" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#6d6d6d" text-anchor="middle">
      PRACTICE PROJECT · SQL · POWER BI / TABLEAU
    </text>
  </g>
</svg>
