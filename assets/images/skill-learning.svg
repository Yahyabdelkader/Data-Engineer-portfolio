<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" rx="12" fill="#1e1e1e"/>
  <rect x="0" y="0" width="400" height="34" rx="12" fill="#2d2d2d"/>
  <circle cx="20" cy="17" r="4.5" fill="#555"/>
  <circle cx="34" cy="17" r="4.5" fill="#555"/>
  <circle cx="48" cy="17" r="4.5" fill="#555"/>
  <text x="200" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#888" text-anchor="middle">docker-compose.infra.yml</text>

  <!-- Docker / Kafka / Azure architecture blocks -->
  <g transform="translate(24, 52)">
    <!-- Kafka broker block -->
    <rect width="105" height="135" rx="8" fill="#2a2a2a" stroke="#3d3d3d" stroke-width="1"/>
    <rect x="12" y="14" width="24" height="24" rx="4" fill="#3a3429"/>
    <text x="24" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e3caa6" text-anchor="middle">K</text>
    <text x="12" y="56" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">Kafka</text>
    <text x="12" y="72" font-family="'Inter', sans-serif" font-size="8.5" fill="#888">Event Streaming</text>
    <text x="12" y="90" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e3caa6">topic: events</text>
    <text x="12" y="105" font-family="'JetBrains Mono', monospace" font-size="8" fill="#888">partitions: 3</text>
    <text x="12" y="120" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2d7a46">RUNNING</text>

    <!-- Docker block -->
    <rect x="120" width="105" height="135" rx="8" fill="#2a2a2a" stroke="#3d3d3d" stroke-width="1"/>
    <rect x="132" y="14" width="24" height="24" rx="4" fill="#2d3748"/>
    <text x="144" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#63b3ed" text-anchor="middle">D</text>
    <text x="132" y="56" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">Docker</text>
    <text x="132" y="72" font-family="'Inter', sans-serif" font-size="8.5" fill="#888">Containerized</text>
    <text x="132" y="90" font-family="'JetBrains Mono', monospace" font-size="8" fill="#63b3ed">de_pipeline:v1</text>
    <text x="132" y="105" font-family="'JetBrains Mono', monospace" font-size="8" fill="#888">isolated env</text>
    <text x="132" y="120" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2d7a46">HEALTHY</text>

    <!-- Azure block -->
    <rect x="240" width="112" height="135" rx="8" fill="#2a2a2a" stroke="#3d3d3d" stroke-width="1"/>
    <rect x="252" y="14" width="24" height="24" rx="4" fill="#233547"/>
    <text x="264" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#0078d4" text-anchor="middle">A</text>
    <text x="252" y="56" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">Azure</text>
    <text x="252" y="72" font-family="'Inter', sans-serif" font-size="8.5" fill="#888">Cloud Data Lake</text>
    <text x="252" y="90" font-family="'JetBrains Mono', monospace" font-size="8" fill="#63b3ed">ADLS Gen2</text>
    <text x="252" y="105" font-family="'JetBrains Mono', monospace" font-size="8" fill="#888">blob storage</text>
    <text x="252" y="120" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2d7a46">CONNECTED</text>
  </g>

  <rect x="24" y="208" width="180" height="18" rx="4" fill="#9e8867" opacity="0.3"/>
  <text x="32" y="221" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#e3caa6">STREAMING · CLOUD · CONTAINERS</text>
</svg>
