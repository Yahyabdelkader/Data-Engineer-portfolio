<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" rx="12" fill="#1e1e1e"/>
  <rect x="0" y="0" width="400" height="34" rx="12" fill="#2d2d2d"/>
  <!-- Window buttons -->
  <circle cx="20" cy="17" r="4.5" fill="#555"/>
  <circle cx="34" cy="17" r="4.5" fill="#555"/>
  <circle cx="48" cy="17" r="4.5" fill="#555"/>
  <text x="200" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#888" text-anchor="middle">query_analytics.sql</text>

  <!-- SQL query code -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#d4d4d4">
    <text x="24" y="65"><tspan fill="#e3caa6">SELECT</tspan> date_trunc(<tspan fill="#ce9178">'month'</tspan>, order_date) <tspan fill="#e3caa6">AS</tspan> period,</text>
    <text x="24" y="90">       category, <tspan fill="#e3caa6">SUM</tspan>(amount) <tspan fill="#e3caa6">AS</tspan> total_revenue,</text>
    <text x="24" y="115">       <tspan fill="#e3caa6">COUNT</tspan>(<tspan fill="#e3caa6">DISTINCT</tspan> customer_id) <tspan fill="#e3caa6">AS</tspan> buyers</text>
    <text x="24" y="140"><tspan fill="#e3caa6">FROM</tspan> analytics.orders_fact</text>
    <text x="24" y="165"><tspan fill="#e3caa6">WHERE</tspan> status = <tspan fill="#ce9178">'COMPLETED'</tspan></text>
    <text x="24" y="190"><tspan fill="#e3caa6">GROUP BY</tspan> <tspan fill="#b5cea8">1, 2</tspan> <tspan fill="#e3caa6">ORDER BY</tspan> period <tspan fill="#e3caa6">DESC</tspan>;</text>
  </g>
  <rect x="24" y="208" width="155" height="18" rx="4" fill="#9e8867" opacity="0.3"/>
  <text x="32" y="221" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#e3caa6">POSTGRES · MYSQL · DDL / DML</text>
</svg>
