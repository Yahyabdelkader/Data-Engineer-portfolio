  <rect x="24" y="210" width="170" height="18" rx="4" fill="#9e8867" opacity="0.3"/>
  <text x="32" y="223" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#e3caa6">POWER BI · TABLEAU · METRICS</text>
