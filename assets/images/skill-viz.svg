<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" rx="12" fill="#1e1e1e"/>
  <rect x="0" y="0" width="400" height="34" rx="12" fill="#2d2d2d"/>
  <circle cx="20" cy="17" r="4.5" fill="#555"/>
  <circle cx="34" cy="17" r="4.5" fill="#555"/>
  <circle cx="48" cy="17" r="4.5" fill="#555"/>
  <text x="200" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#888" text-anchor="middle">powerbi_dashboard.pbix</text>

  <!-- Dash preview inside dark mode terminal -->
  <g transform="translate(24, 50)">
    <!-- KPI card -->
    <rect width="105" height="55" rx="6" fill="#2a2a2a"/>
    <text x="12" y="20" font-family="'Inter', sans-serif" font-size="8.5" fill="#888">CONVERSION</text>
    <text x="12" y="42" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#e3caa6">4.82%</text>

    <!-- KPI card 2 -->
    <rect x="120" width="105" height="55" rx="6" fill="#2a2a2a"/>
    <text x="132" y="20" font-family="'Inter', sans-serif" font-size="8.5" fill="#888">RUN RATE</text>
    <text x="132" y="42" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">$1.2M</text>

    <!-- KPI card 3 -->
    <rect x="240" width="112" height="55" rx="6" fill="#2a2a2a"/>
    <text x="252" y="20" font-family="'Inter', sans-serif" font-size="8.5" fill="#888">CHURN</text>
    <text x="252" y="42" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#9e8867">0.4%</text>

    <!-- Mini Chart area -->
    <rect y="68" width="352" height="85" rx="6" fill="#2a2a2a"/>
    <path d="M 20 135 L 70 120 L 120 130 L 170 100 L 220 110 L 270 85 L 320 80" fill="none" stroke="#e3caa6" stroke-width="2"/>
    <circle cx="320" cy="80" r="3" fill="#e3caa6"/>
